<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">Real GitHub CI evidence extension</title><desc id="desc">Pinned historical run and attempt-specific jobs are collected into a hashed snapshot. Missing steps and diagnostic logs are explicit. One Windows Qwen summary was verified against source metadata.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1200" height="830" fill="#F8FAFC"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="122" fill="#0F172A"/><text x="32" y="31" font-size="13" fill="#93C5FD" font-weight="700">PROJECT 09 / OPTIONAL REAL CI EXTENSION</text><text x="32" y="70" font-size="30" fill="#FFFFFF" font-weight="700">A pinned CI run with explicit evidence gaps</text><text x="32" y="101" font-size="16" fill="#CBD5E1" font-weight="400">Windows metadata, Qwen summary and a scheduled four-worker recovery are verified.</text><rect x="32" y="158" width="350" height="165" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="52" y="193" font-size="23" fill="#172554" font-weight="700">GitHub source</text><text x="52" y="228" font-size="16" fill="#172554" font-weight="400">Home Assistant BRI demo</text><text x="52" y="253" font-size="16" fill="#172554" font-weight="400">Run 21890541227, attempt 1</text><text x="52" y="278" font-size="16" fill="#172554" font-weight="400">Historical hassfest failure</text><rect x="422" y="158" width="350" height="165" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="442" y="193" font-size="23" fill="#172554" font-weight="700">Collect metadata</text><text x="442" y="228" font-size="16" fill="#172554" font-weight="400">Run + attempt-specific jobs</text><text x="442" y="253" font-size="16" fill="#172554" font-weight="400">Validate IDs and run consistency</text><text x="442" y="278" font-size="16" fill="#172554" font-weight="400">Record original run date</text><rect x="812" y="158" width="356" height="165" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="832" y="193" font-size="23" fill="#134E4A" font-weight="700">Save evidence</text><text x="832" y="228" font-size="16" fill="#134E4A" font-weight="400">JSON snapshot; unique filename</text><text x="832" y="253" font-size="16" fill="#134E4A" font-weight="400">SHA-256 in Markdown report</text><text x="832" y="278" font-size="16" fill="#134E4A" font-weight="400">Retain evidence after model error</text><path d="M382 240 H422" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M772 240 H812" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="390" width="550" height="165" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/><text x="52" y="425" font-size="23" fill="#78350F" font-weight="700">Missing-evidence boundary</text><text x="52" y="460" font-size="16" fill="#78350F" font-weight="400">One failed job; step list empty</text><text x="52" y="485" font-size="16" fill="#78350F" font-weight="400">Diagnostic logs not retrieved</text><text x="52" y="510" font-size="16" fill="#78350F" font-weight="400">Root cause unavailable</text><rect x="618" y="390" width="550" height="165" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="638" y="425" font-size="23" fill="#3B0764" font-weight="700">Optional local summary</text><text x="638" y="460" font-size="16" fill="#3B0764" font-weight="400">Reuse Qwen 3.5 4B helper</text><text x="638" y="485" font-size="16" fill="#3B0764" font-weight="400">Summarize run ID, status, conclusion</text><text x="638" y="510" font-size="16" fill="#3B0764" font-weight="400">Windows model summary verified</text><rect x="32" y="617" width="1136" height="130" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="52" y="652" font-size="23" fill="#14532D" font-weight="700">Prepared and checked</text><text x="52" y="687" font-size="16" fill="#14532D" font-weight="400">22 offline checks passed on Windows. Metadata and Qwen modes saved reports and returned 0.</text><text x="52" y="712" font-size="16" fill="#14532D" font-weight="400">One historical failure case reviewed. Four-worker scheduled recovery verified; broader CI evaluation remains future work.</text><text x="32" y="795" font-size="16" fill="#475569" font-weight="400">Broader diagnosis-quality evaluation needs representative evidence, expected outcomes, and model review.</text></g></svg>
