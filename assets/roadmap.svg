<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="636" viewBox="0 0 1200 636" role="img" aria-labelledby="title desc"><title id="title">Project 9 implementation roadmap</title><desc id="desc">Local inference, worker, runner, on-demand scheduling, failure isolation and recovery verified. One automatic Cedar execution verified. Automatic four-worker recovery verified. Weather worker verified from supplied output. Stock and RSS news workers are implemented and verified for their recorded scope.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1200" height="636" rx="22" fill="#F8FAFC"/><g font-family="DejaVu Sans, Arial, sans-serif"><path d="M22 0H1178Q1200 0 1200 22V122H0V22Q0 0 22 0" fill="#0F172A"/><text x="32" y="31" font-size="13" fill="#93C5FD" font-weight="700">ROADMAP / IMPLEMENTATION AND EVIDENCE</text><text x="32" y="70" font-size="30" fill="#FFFFFF" font-weight="700">From local inference to daily automation</text><text x="32" y="101" font-size="16" fill="#CBD5E1" font-weight="400">Each stage carries an explicit status so readers can see what has been demonstrated</text><rect x="32" y="156" width="550" height="116" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="52" y="190" font-size="23" fill="#3B0764" font-weight="700">Local summary</text><text x="52" y="222" font-size="16" fill="#3B0764" font-weight="400">VERIFIED</text><text x="52" y="247" font-size="16" fill="#3B0764" font-weight="400">Qwen preserved the Cedar failure facts</text><rect x="618" y="156" width="550" height="116" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="638" y="190" font-size="23" fill="#134E4A" font-weight="700">Cedar, weather and runner</text><text x="638" y="222" font-size="16" fill="#134E4A" font-weight="400">VERIFIED</text><text x="638" y="247" font-size="16" fill="#134E4A" font-weight="400">Cedar and weather reports; exit code 0</text><rect x="32" y="300" width="550" height="116" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="52" y="334" font-size="23" fill="#14532D" font-weight="700">Windows launch</text><text x="52" y="366" font-size="16" fill="#14532D" font-weight="400">VERIFIED ON DEMAND</text><text x="52" y="391" font-size="16" fill="#14532D" font-weight="400">Task Scheduler returned result 0</text><rect x="618" y="300" width="550" height="116" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="638" y="334" font-size="23" fill="#14532D" font-weight="700">Failure and recovery</text><text x="638" y="366" font-size="16" fill="#14532D" font-weight="400">VERIFIED</text><text x="638" y="391" font-size="16" fill="#14532D" font-weight="400">Failure exit 1; recovery exit 0</text><rect x="32" y="444" width="550" height="116" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="52" y="478" font-size="23" fill="#14532D" font-weight="700">Daily automation</text><text x="52" y="510" font-size="16" fill="#14532D" font-weight="400">FOUR-WORKER TIMED RUN VERIFIED</text><text x="52" y="535" font-size="16" fill="#14532D" font-weight="400">Nov 20 at 14:13:59; runner exit 0</text><rect x="618" y="444" width="550" height="116" rx="14" fill="#F8FAFC" stroke="#475569" stroke-width="2"/><text x="638" y="478" font-size="23" fill="#0F172A" font-weight="700">Stock and headline news</text><text x="638" y="510" font-size="16" fill="#0F172A" font-weight="400">VERIFIED ON WINDOWS</text><text x="638" y="535" font-size="16" fill="#0F172A" font-weight="400">Four reports saved; 12 tests passed</text><text x="32" y="603" font-size="16" fill="#475569" font-weight="400">Four daily workers verified manually. CI metadata and Qwen summary verified on Windows; four-worker scheduled recovery verified.</text></g></svg>
