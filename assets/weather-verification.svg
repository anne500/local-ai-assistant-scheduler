<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="474" viewBox="0 0 1200 474" role="img" aria-labelledby="title desc"><title id="title">Weather source and summary comparison</title><desc id="desc">One historical weather sample matched five source values with distinct bullets and exit code zero. Observation time unavailable.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1200" height="474" fill="#F8FAFC"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="122" fill="#0F172A"/><text x="32" y="31" font-size="13" fill="#93C5FD" font-weight="700">PROJECT 09 / TWO-WORKER EXECUTION</text><text x="32" y="70" font-size="30" fill="#FFFFFF" font-weight="700">Weather evidence matches the observed brief</text><text x="32" y="101" font-size="16" fill="#CBD5E1" font-weight="400">Historical sample from the November 19 Windows run; reviewed manually against saved JSON.</text><rect x="32" y="156" width="550" height="205" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="52" y="188" font-size="23" fill="#134E4A" font-weight="700">Retrieved source</text><text x="52" y="220" font-size="16" fill="#134E4A" font-weight="400">New York; Clear</text><text x="52" y="244" font-size="16" fill="#134E4A" font-weight="400">Temperature 54 F; feels like 51 F</text><text x="52" y="268" font-size="16" fill="#134E4A" font-weight="400">Humidity 55%; wind 4 mph</text><text x="52" y="292" font-size="16" fill="#134E4A" font-weight="400">Observation time unavailable</text><rect x="618" y="156" width="550" height="205" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="638" y="188" font-size="23" fill="#14532D" font-weight="700">Generated summary</text><text x="638" y="220" font-size="16" fill="#14532D" font-weight="400">Bullet 1: location, clear, 54 F, feels like 51 F</text><text x="638" y="244" font-size="16" fill="#14532D" font-weight="400">Bullet 2: humidity 55%, wind 4 mph</text><text x="638" y="268" font-size="16" fill="#14532D" font-weight="400">Distinct facts preserved in this sample</text><text x="638" y="292" font-size="16" fill="#14532D" font-weight="400">Runner exit code = 0</text><path d="M582 257 H618" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="32" y="410" font-size="16" fill="#475569" font-weight="400">Retrieved at 2026-11-20T00:29:49.894568+00:00. Retrieval time does not establish observation age.</text><text x="32" y="441" font-size="16" fill="#475569" font-weight="400">Earlier prompt attempts added a causal phrase, then duplicate bullets. Final responsibilities fixed the sample.</text></g></svg>
