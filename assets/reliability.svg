<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc"><title id="title">Failure isolation and recovery</title><desc id="desc">Controlled failing worker, Cedar continuation with exit 1, then normal recovery with exit 0. One automatic Cedar run verified on November 19; automatic weather execution pending.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1200" height="550" rx="22" fill="#F8FAFC"/><g font-family="DejaVu Sans, Arial, sans-serif"><path d="M22 0H1178Q1200 0 1200 22V122H0V22Q0 0 22 0" fill="#0F172A"/><text x="32" y="31" font-size="13" fill="#93C5FD" font-weight="700">RELIABILITY / OBSERVED WINDOWS RUNS</text><text x="32" y="70" font-size="30" fill="#FFFFFF" font-weight="700">A failed worker still allows Cedar to complete</text><text x="32" y="101" font-size="16" fill="#CBD5E1" font-weight="400">Controlled failure on November 18, 2026, followed by a successful normal run</text><rect x="32" y="156" width="550" height="147" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/><text x="52" y="190" font-size="23" fill="#7F1D1D" font-weight="700">Controlled failure</text><text x="52" y="222" font-size="16" fill="#7F1D1D" font-weight="400">aaa_failure_demo.py raises RuntimeError</text><text x="52" y="247" font-size="16" fill="#7F1D1D" font-weight="400">Runner logs the traceback and continues</text><text x="52" y="272" font-size="16" fill="#7F1D1D" font-weight="400">Temporary test worker removed afterward</text><rect x="618" y="156" width="550" height="147" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="638" y="190" font-size="23" fill="#14532D" font-weight="700">Cedar still succeeds</text><text x="638" y="222" font-size="16" fill="#14532D" font-weight="400">Cedar report saved at 20:42:50</text><text x="638" y="247" font-size="16" fill="#14532D" font-weight="400">One worker failed during this invocation</text><text x="638" y="272" font-size="16" fill="#14532D" font-weight="400">Runner exit code = 1</text><path d="M582 229 L618 229" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="339" width="550" height="133" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="52" y="373" font-size="23" fill="#14532D" font-weight="700">Normal recovery</text><text x="52" y="405" font-size="16" fill="#14532D" font-weight="400">Subsequent normal runner invocation</text><text x="52" y="430" font-size="16" fill="#14532D" font-weight="400">Cedar report saved at 22:50:43</text><text x="52" y="455" font-size="16" fill="#14532D" font-weight="400">Runner exit code = 0</text><rect x="618" y="339" width="550" height="133" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="638" y="373" font-size="23" fill="#14532D" font-weight="700">Automatic Cedar run</text><text x="638" y="405" font-size="16" fill="#14532D" font-weight="400">Nov 19 at 08:00:01; task result 0</text><text x="638" y="430" font-size="16" fill="#14532D" font-weight="400">Cedar report saved at 08:00:13</text><text x="638" y="455" font-size="16" fill="#14532D" font-weight="400">Automatic weather run awaits evidence</text><text x="32" y="516" font-size="16" fill="#475569" font-weight="400">Exit code 1 records the overall failure even when another worker successfully saves its report.</text></g></svg>
