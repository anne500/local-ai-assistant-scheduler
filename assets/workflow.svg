<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">Project 9 two-worker architecture</title><desc id="desc">Windows Task Scheduler launches a sequential runner. Cedar reads a local synthetic fixture. Weather retrieves wttr.in JSON. Each calls local Ollama and returns text for the runner to save.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1200" height="1180" fill="#F8FAFC"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="122" fill="#0F172A"/><text x="32" y="31" font-size="13" fill="#93C5FD" font-weight="700">PROJECT 09 / TWO-WORKER EXECUTION</text><text x="32" y="70" font-size="30" fill="#FFFFFF" font-weight="700">Two workers, separate evidence, local summaries</text><text x="32" y="101" font-size="16" fill="#CBD5E1" font-weight="400">Cedar runs before weather; the runner writes a report after each successful worker.</text><rect x="400" y="150" width="400" height="105" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="420" y="182" font-size="23" fill="#172554" font-weight="700">Windows Task Scheduler</text><text x="420" y="214" font-size="16" fill="#172554" font-weight="400">Daily 08:00 configured</text><text x="420" y="238" font-size="16" fill="#172554" font-weight="400">On-demand launch verified</text><rect x="400" y="295" width="400" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="420" y="327" font-size="23" fill="#172554" font-weight="700">scheduler.py</text><text x="420" y="359" font-size="16" fill="#172554" font-weight="400">Import workers in filename order</text><text x="420" y="383" font-size="16" fill="#172554" font-weight="400">Call run(); save returned report</text><path d="M600 255 V295" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="80" y="455" width="440" height="105" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="100" y="487" font-size="23" fill="#134E4A" font-weight="700">Cedar fixture</text><text x="100" y="519" font-size="16" fill="#134E4A" font-weight="400">fixtures/cedar-ci.txt</text><text x="100" y="543" font-size="16" fill="#134E4A" font-weight="400">Synthetic CI failure evidence</text><rect x="680" y="455" width="440" height="105" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="700" y="487" font-size="23" fill="#172554" font-weight="700">wttr.in weather service</text><text x="700" y="519" font-size="16" fill="#172554" font-weight="400">New York JSON over HTTPS</text><text x="700" y="543" font-size="16" fill="#172554" font-weight="400">Network request; 30-second timeout</text><rect x="80" y="610" width="440" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="100" y="642" font-size="23" fill="#172554" font-weight="700">Cedar worker</text><text x="100" y="674" font-size="16" fill="#172554" font-weight="400">agents/cedar_ci.py</text><text x="100" y="698" font-size="16" fill="#172554" font-weight="400">One sentence; 64-token budget</text><rect x="680" y="610" width="440" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="700" y="642" font-size="23" fill="#172554" font-weight="700">Weather worker</text><text x="700" y="674" font-size="16" fill="#172554" font-weight="400">agents/weather_brief.py</text><text x="700" y="698" font-size="16" fill="#172554" font-weight="400">Requests two bullets; 128-token budget</text><path d="M400 350 H40 V665 H80" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M800 350 H1160 V665 H1120" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M300 560 V610" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M900 560 V610" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="400" y="810" width="400" height="110" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="420" y="842" font-size="23" fill="#3B0764" font-weight="700">Shared local Ollama</text><text x="420" y="874" font-size="16" fill="#3B0764" font-weight="400">qwen3.5:4b at localhost:11434</text><text x="420" y="898" font-size="16" fill="#3B0764" font-weight="400">Thinking off; temperature 0</text><path d="M300 720 V765 H550 V810" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M900 720 V765 H650 V810" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="32" y="956" font-size="17" fill="#475569" font-weight="400">Both workers request a summary from local Ollama and return report text to the Python runner.</text><rect x="80" y="995" width="440" height="110" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="100" y="1027" font-size="23" fill="#134E4A" font-weight="700">Saved Markdown</text><text x="100" y="1059" font-size="16" fill="#134E4A" font-weight="400">Cedar and weather timestamped files</text><text x="100" y="1083" font-size="16" fill="#134E4A" font-weight="400">Weather retains URL, JSON and UTC time</text><rect x="680" y="995" width="440" height="110" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="700" y="1027" font-size="23" fill="#14532D" font-weight="700">Runner outcome</text><text x="700" y="1059" font-size="16" fill="#14532D" font-weight="400">outputs/runner.log records each result</text><text x="700" y="1083" font-size="16" fill="#14532D" font-weight="400">Exit 0 if all succeed; 1 for any failure</text><text x="32" y="1148" font-size="17" fill="#475569" font-weight="400">The runner writes these files. A worker error is logged before the next worker runs.</text></g></svg>
