<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="842" viewBox="0 0 1200 842" role="img" aria-labelledby="title desc"><title id="title">Project 9 workflow</title><desc id="desc">Task Scheduler launches the Python runner. Cedar reads synthetic evidence and calls local Ollama. The runner saves reports and logs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1200" height="842" rx="22" fill="#F8FAFC"/><g font-family="DejaVu Sans, Arial, sans-serif"><path d="M22 0H1178Q1200 0 1200 22V122H0V22Q0 0 22 0" fill="#0F172A"/><text x="32" y="31" font-size="13" fill="#93C5FD" font-weight="700">WORKFLOW / COMPONENT ROLES</text><text x="32" y="70" font-size="30" fill="#FFFFFF" font-weight="700">How a scheduled CI brief is produced</text><text x="32" y="101" font-size="16" fill="#CBD5E1" font-weight="400">One permanent worker reads a local fixture and calls Ollama on localhost</text><rect x="400" y="152" width="400" height="112" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="420" y="186" font-size="23" fill="#172554" font-weight="700">Windows Task Scheduler</text><text x="420" y="218" font-size="16" fill="#172554" font-weight="400">Daily 08:00 configured; on-demand tested</text><rect x="400" y="302" width="400" height="112" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="420" y="336" font-size="23" fill="#172554" font-weight="700">scheduler.py</text><text x="420" y="368" font-size="16" fill="#172554" font-weight="400">Discover workers; run each; save reports</text><path d="M600 264 L600 302" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="452" width="320" height="112" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="52" y="486" font-size="23" fill="#134E4A" font-weight="700">Cedar fixture</text><text x="52" y="518" font-size="16" fill="#134E4A" font-weight="400">fixtures/cedar-ci.txt</text><text x="52" y="543" font-size="16" fill="#134E4A" font-weight="400">Synthetic failure evidence</text><rect x="400" y="452" width="400" height="112" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="420" y="486" font-size="23" fill="#172554" font-weight="700">Cedar worker</text><text x="420" y="518" font-size="16" fill="#172554" font-weight="400">agents/cedar_ci.py</text><text x="420" y="543" font-size="16" fill="#172554" font-weight="400">Read evidence; request one sentence</text><rect x="848" y="452" width="320" height="112" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="868" y="486" font-size="23" fill="#3B0764" font-weight="700">Local Ollama</text><text x="868" y="518" font-size="16" fill="#3B0764" font-weight="400">qwen3.5:4b</text><text x="868" y="543" font-size="16" fill="#3B0764" font-weight="400">Thinking off; 64-token limit</text><path d="M580 414 L580 452" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M620 452 L620 414" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M352 508 L400 508" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 488 L848 488" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M848 530 L800 530" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="180" y="622" width="380" height="112" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="200" y="656" font-size="23" fill="#134E4A" font-weight="700">Markdown report</text><text x="200" y="688" font-size="16" fill="#134E4A" font-weight="400">outputs/cedar-ci-&lt;timestamp&gt;.md</text><text x="200" y="713" font-size="16" fill="#134E4A" font-weight="400">Generated summary plus source evidence</text><rect x="640" y="622" width="380" height="112" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="660" y="656" font-size="23" fill="#14532D" font-weight="700">Run record</text><text x="660" y="688" font-size="16" fill="#14532D" font-weight="400">outputs/runner.log</text><text x="660" y="713" font-size="16" fill="#14532D" font-weight="400">Process exit code 0 or 1</text><path d="M400 358 H370 V622" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M800 358 H830 V622" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="785" font-size="16" fill="#475569" font-weight="400">Blue = processing   Purple = model   Teal = files   Green = observable output</text><text x="32" y="814" font-size="16" fill="#475569" font-weight="400">The Python runner writes the reports. The worker returns report text to the runner.</text></g></svg>
