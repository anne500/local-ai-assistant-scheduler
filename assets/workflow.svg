<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1170" viewBox="0 0 1200 1170" role="img" aria-labelledby="title desc"><title id="title">Project 9 four-worker architecture</title><desc id="desc">Scheduler discovers AI news, Cedar, stock and weather in that order. Each worker uses local Ollama. All four workers executed on Windows. Stock sample verified. Corrected headline-only reporting is verified on Windows. Runner saves reports and logs.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><rect width="1200" height="1170" fill="#F8FAFC"/><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1200" height="122" fill="#0F172A"/><text x="32" y="31" font-size="13" fill="#93C5FD" font-weight="700">PROJECT 09 / FOUR-WORKER ARCHITECTURE</text><text x="32" y="70" font-size="30" fill="#FFFFFF" font-weight="700">One runner, four evidence sources</text><text x="32" y="101" font-size="16" fill="#CBD5E1" font-weight="400">Sequential filename order: AI news, Cedar, GOOGL stock, weather.</text><rect x="400" y="152" width="400" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="418" y="186" font-size="23" fill="#172554" font-weight="700">Windows Task Scheduler</text><text x="418" y="218" font-size="16" fill="#172554" font-weight="400">08:00 daily; Cedar run verified</text><text x="418" y="243" font-size="16" fill="#172554" font-weight="400">Automatic weather run pending</text><rect x="400" y="305" width="400" height="110" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="418" y="339" font-size="23" fill="#172554" font-weight="700">scheduler.py</text><text x="418" y="371" font-size="16" fill="#172554" font-weight="400">Imports modules; calls run() in order</text><text x="418" y="396" font-size="16" fill="#172554" font-weight="400">Logs failures; continues next worker</text><path d="M600 262 V305" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="32" y="480" width="266" height="160" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="50" y="514" font-size="23" fill="#172554" font-weight="700">AI news</text><text x="50" y="546" font-size="16" fill="#172554" font-weight="400">Hugging Face RSS excerpts</text><text x="50" y="571" font-size="16" fill="#172554" font-weight="400">Empty excerpt: headline only</text><text x="50" y="596" font-size="16" fill="#172554" font-weight="400">Headline mode verified</text><path d="M600 415 V450 H165 V480" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="322" y="480" width="266" height="160" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="340" y="514" font-size="23" fill="#172554" font-weight="700">Cedar CI</text><text x="340" y="546" font-size="16" fill="#172554" font-weight="400">Synthetic local fixture</text><text x="340" y="571" font-size="16" fill="#172554" font-weight="400">One-sentence CI brief</text><text x="340" y="596" font-size="16" fill="#172554" font-weight="400">Windows model run verified</text><path d="M600 415 V450 H455 V480" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="612" y="480" width="266" height="160" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="630" y="514" font-size="23" fill="#172554" font-weight="700">GOOGL stock</text><text x="630" y="546" font-size="16" fill="#172554" font-weight="400">Yahoo chart quote</text><text x="630" y="571" font-size="16" fill="#172554" font-weight="400">Python-computed change</text><text x="630" y="596" font-size="16" fill="#172554" font-weight="400">Windows model run verified</text><path d="M600 415 V450 H745 V480" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="902" y="480" width="266" height="160" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="920" y="514" font-size="23" fill="#172554" font-weight="700">Weather</text><text x="920" y="546" font-size="16" fill="#172554" font-weight="400">wttr.in New York JSON</text><text x="920" y="571" font-size="16" fill="#172554" font-weight="400">Two-bullet weather brief</text><text x="920" y="596" font-size="16" fill="#172554" font-weight="400">Windows model run verified</text><path d="M600 415 V450 H1035 V480" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="300" y="745" width="600" height="115" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="318" y="779" font-size="23" fill="#3B0764" font-weight="700">Local Ollama / qwen3.5:4b</text><text x="318" y="811" font-size="16" fill="#3B0764" font-weight="400">Thinking off; temperature 0; bounded output</text><text x="318" y="836" font-size="16" fill="#3B0764" font-weight="400">Each worker returns its report text to the runner</text><path d="M165 640 L450 745" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M455 640 L550 745" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M745 640 L650 745" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1035 640 L750 745" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="32" y="930" width="550" height="130" rx="14" fill="#CCFBF1" stroke="#0F766E" stroke-width="2"/><text x="50" y="964" font-size="23" fill="#134E4A" font-weight="700">Runner saves Markdown</text><text x="50" y="996" font-size="16" fill="#134E4A" font-weight="400">ai-news / cedar-ci / googl-stock / weather-brief</text><text x="50" y="1021" font-size="16" fill="#134E4A" font-weight="400">Timestamped reports retain source evidence</text><text x="50" y="1046" font-size="16" fill="#134E4A" font-weight="400">Outputs stay in the local outputs directory</text><rect x="618" y="930" width="550" height="130" rx="14" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/><text x="636" y="964" font-size="23" fill="#14532D" font-weight="700">Runner records outcome</text><text x="636" y="996" font-size="16" fill="#14532D" font-weight="400">runner.log includes successes and errors</text><text x="636" y="1021" font-size="16" fill="#14532D" font-weight="400">Exit code 0 when all workers succeed</text><text x="636" y="1046" font-size="16" fill="#14532D" font-weight="400">Exit code 1 if any worker fails</text><text x="32" y="1110" font-size="16" fill="#475569" font-weight="400">Blue = processing. Headline-only entries skip local model generation.</text><text x="32" y="1140" font-size="16" fill="#475569" font-weight="400">The RSS feed covers one publisher. External retrieval requires network access; inference is local.</text></g></svg>
